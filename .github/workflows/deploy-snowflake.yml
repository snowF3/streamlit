name: Deploy to Snowflake

on:
  push:
    branches:
      - snowflake-dev
      - snowflake-prod

jobs:
  snowflake-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install Snowflake CLI
        run: |
          pip install snowflake-connector-python

      - name: Fetch Git Repository in Snowflake
        env:
          SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER: ${{ secrets.SNOWFLAKE_USER }}
          SF_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          python3 -c "
          import snowflake.connector
          conn = snowflake.connector.connect(
              account='${SF_ACCOUNT}',
              user='${SF_USER}',
              password='${SF_PASSWORD}',
              warehouse='COMPUTE_WH'
          )
          cur = conn.cursor()
          cur.execute('ALTER GIT REPOSITORY \"USER\$SAMUEL918\".PUBLIC.snowf3_streamlit FETCH')
          print('✅ Snowflake Git Repository fetched successfully')
          cur.close()
          conn.close()
          "
